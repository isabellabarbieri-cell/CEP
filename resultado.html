<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Resultado da consulta</title>
</head>

<body>

    <div class="container">

        <h1>Resultado da consulta</h1>    <!--aqui é o titulo da outra pagina-->

        <div
            id="resultado"
            role="status"
            aria-live="polite">
        </div>

        <!--aqui é o botão para abrir o Google-->
        <a
            id="linkMaps"    
            hidden
            target="_blank"
            rel="noopener noreferrer">
            Abrir no Google Maps
        </a>

        <!--e esse é o botão para fazer uma nova consulta-->
        <a
            class="nova-consulta"
            href="index.html">
            Fazer nova consulta
        </a>

    </div>

    <script src="resultado.js"></script>

</body>

</html>
