<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Consulta de CEP</title>
</head>
<body>
    <form id="formConsulta">
 <label for="cep">CEP</label>
 <input id="cep" type="text" inputmode="numeric"
 maxlength="9" placeholder="01001-000" required>
 <label for="cidade">Cidade</label>
 <input id="cidade" type="text"
 placeholder="São Paulo" required>
 <button type="submit">Consultar Endereço</button>
</form>
<p id="mensagem" role="status" aria-live="polite"></p>
<script src="index.js"></script>
<div id="resultado"></div>
<a id="linkMaps"href="#" hidden>
    Ver no Google Maps
</a>

</body>
</html>
