<!DOCTYPE html>
<html lang="pt-br">
<head>  
      <!--esse bloco é para conectar um arquivo no outro-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-512-.png">
    <meta name="theme-color" content="#66bfd0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Consulta CEP">
    <title>Consulta de CEP</title> 

</head>
<body>  
    <!--é a área principal do site-->
   <div class="container">
   <h1>Consulta de CEP</h1>   <!--titulo do página-->
  <form id="formConsulta">
  <label for="cep">CEP</label>  <!--campo para digitar o cep-->
    <input
       id="cep"
         type="text"
       inputmode="numeric"
      maxlength="9"
       placeholder="01001-000"
       required >
            <label for="cidade">Cidade</label> <!--campo para digitar a cidade-->
            <input  
          id="cidade"
           type="text"
      placeholder="São Paulo"
                required >
            <button type="submit">
                Consultar Endereço   <!--essa parte é para consultar os dados -->
            </button>
        </form>
        <p
            id="mensagem"
            role="status"
            aria-live="polite">
        </p>
        <div id="resultado"></div>
        <a
            id="linkMaps"
            href="#"
            hidden>
            Ver no Google Maps    <!-- aqui é para ver o endereço no google maps-->
        </a>
    </div>
    <script src="index.js"></script>
</body>
</html>
